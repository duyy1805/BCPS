<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - BCPS</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="flex h-screen overflow-hidden bg-slate-50 text-slate-800">

    <div id="sidebar-container"></div>

    <div class="flex-1 flex flex-col ml-64 overflow-hidden">

        <div id="header-container"></div>

        <main class="flex-1 overflow-y-auto p-6 scroll-smooth">
            <div class="max-w-7xl mx-auto space-y-6">

                <div
                    class="flex items-center justify-between bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex gap-4 items-center">
                        <div class="font-bold text-slate-700">Bộ lọc thời gian:</div>
                        <input type="date" id="filterFrom"
                            class="border border-slate-200 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
                        <span>-</span>
                        <input type="date" id="filterTo"
                            class="border border-slate-200 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
                        <button onclick="loadDashboard()"
                            class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-blue-700">Áp
                            dụng</button>
                    </div>
                    <button
                        class="bg-slate-100 text-slate-700 px-4 py-1.5 rounded-lg text-sm font-bold border hover:bg-slate-200 flex items-center">
                        <i data-lucide="download" class="w-4 h-4 mr-2"></i> Xuất Excel
                    </button>
                </div>

                <div class="grid grid-cols-4 gap-4" id="kpi-container">
                    <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm text-center text-slate-500">
                        Đang tải KPI...</div>
                </div>

                <div class="grid grid-cols-3 gap-6">
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm col-span-2">
                        <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50 font-bold text-slate-800">Xu
                            hướng phát sinh theo ngày</div>
                        <div class="p-5 h-80">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50 font-bold text-slate-800">Cơ cấu
                            theo Trạng thái</div>
                        <div class="p-5 h-80 flex justify-center">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
                        <div class="px-5 py-4 border-b border-slate-100 bg-slate-50/50 font-bold text-slate-800">Top Bộ
                            phận Xảy ra Lỗi</div>
                        <div class="p-0 overflow-auto max-h-80">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-slate-50 sticky top-0">
                                    <tr>
                                        <th class="p-3">Bộ phận</th>
                                        <th class="p-3 text-center">Số lượng BC</th>
                                        <th class="p-3 text-right">Chi phí (VNĐ)</th>
                                    </tr>
                                </thead>
                                <tbody id="top-dept-body" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
                        <div
                            class="px-5 py-4 border-b border-slate-100 bg-red-50/50 font-bold text-red-800 flex justify-between">
                            <span>Cần xử lý khẩn cấp (Quá hạn)</span>
                            <i data-lucide="alert-triangle" class="w-5 h-5 text-red-500"></i>
                        </div>
                        <div class="p-0 overflow-auto max-h-80">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-slate-50 sticky top-0">
                                    <tr>
                                        <th class="p-3">Mã BCPS</th>
                                        <th class="p-3">Người chịu TN</th>
                                        <th class="p-3 text-right">Quá hạn</th>
                                    </tr>
                                </thead>
                                <tbody id="overdue-body" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
