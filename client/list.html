<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Danh sách BCPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="flex h-screen overflow-hidden">
    <div id="sidebar-container"></div>
    <div class="flex-1 flex flex-col ml-64">
        <div id="header-container"></div>
        <main class="p-6 overflow-y-auto">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4 flex gap-4">
                <input id="kw" placeholder="Tìm mã BCPS, đơn hàng..."
                    class="border p-2 rounded-lg flex-1 text-sm outline-none focus:border-blue-500" />
                <select id="status" class="border p-2 rounded-lg text-sm outline-none">
                    <option value="">Tất cả trạng thái</option>
                    <option value="WAITING_APPROVAL">Chờ phê duyệt</option>
                    <option value="WAITING_FEEDBACK">Chờ phản hồi</option>
                </select>
                <button onclick="loadList()"
                    class="bg-slate-800 text-white px-6 py-2 rounded-lg font-medium hover:bg-slate-900">Lọc dữ
                    liệu</button>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-sm text-left">
                    <thead class="bg-slate-50 border-b text-slate-600">
                        <tr>
                            <th class="p-4">Mã Báo Cáo</th>
                            <th class="p-4">Kế hoạch ERP</th>
                            <th class="p-4">Loại & Nguyên nhân</th>
                            <th class="p-4">Bộ phận</th>
                            <th class="p-4 text-right">Chi phí</th>
                            <th class="p-4 text-center">Trạng thái</th>
                            <th class="p-4 text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/list.js"></script>
</body>

</html>
